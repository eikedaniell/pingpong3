<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ping-pong online</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#14392f;--mesa:#1d5c4a;--linha:#e9efe6;--bola:#ffb703;--txt:#f3f6ef;--btn:#ffb703;--btn-txt:#1a1a1a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font-family:"Trebuchet MS",Verdana,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;touch-action:none}
h1{margin:0;font-size:clamp(28px,6vw,44px);letter-spacing:-.5px}
#menu,#espera{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;max-width:380px}
button,input{font:inherit;border-radius:10px;border:0;padding:12px 20px}
button{background:var(--btn);color:var(--btn-txt);font-weight:700;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #fff}
input{text-align:center;text-transform:uppercase;letter-spacing:6px;font-size:22px;width:180px;color:#111}
.linha{display:flex;gap:8px}
#codigo{font-size:56px;font-weight:700;letter-spacing:10px;color:var(--bola)}
#msg{min-height:1.4em;opacity:.85;text-align:center;max-width:400px;font-size:14px}
#jogo{display:none;flex-direction:column;align-items:center;gap:8px;width:100%}
canvas{width:min(100%,900px);aspect-ratio:8/5;background:var(--mesa);border:4px solid var(--linha);border-radius:8px}
.hidden{display:none!important}
</style>
</head>
<body>
<h1>Ping-pong online</h1>

<div id="menu">
  <button id="criar">Criar sala</button>
  <div>ou entre numa sala existente</div>
  <div class="linha"><input id="entrada" maxlength="4" placeholder="CÓDIGO" aria-label="Código da sala"><button id="entrar">Entrar</button></div>
</div>

<div id="espera" class="hidden">
  <div>Passe este código para o outro jogador:</div>
  <div id="codigo">----</div>
  <div>Esperando alguém entrar…</div>
</div>

<div id="jogo">
  <canvas id="c" width="800" height="500"></canvas>
  <div id="dica">Mova o mouse, o dedo ou use ↑ ↓ / W S</div>
</div>
<div id="msg" role="status"></div>

<script>
const $ = id => document.getElementById(id);
const W = 800, H = 500, PW = 12, PH = 90, R = 9, VENCE = 7;
const PREFIXO = "pingpong-sala-";

// Configuração com servidores STUN públicos do Google para ultrapassar NAT/Firewall de roteadores Wi-Fi
const PEER_CONFIG = {
  config: {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun2.l.google.com:19302' },
      { urls: 'stun:stun3.l.google.com:19302' },
      { urls: 'stun:stun4.l.google.com:19302' }
    ]
  }
};

let peer, conn, souHost = false;
let s = novoEstado();       // estado do jogo (host é a autoridade)
let meuY = H/2, outroY = H/2; // convidado envia seu Y; host guarda em outroY
const teclas = {};

function novoEstado(){
  return {bx:W/2, by:H/2, vx:0, vy:0, y1:H/2, y2:H/2, p1:0, p2:0, pausa:90, fim:""};
}
function saque(dir){
  const a = (Math.random()-.5)*0.8;
  s.bx = W/2; s.by = H/2;
  s.vx = 5*dir*Math.cos(a); s.vy = 5*Math.sin(a);
  s.pausa = 60;
}
function mostrar(qual){
  ["menu","espera"].forEach(i => $(i).classList.toggle("hidden", i !== qual));
  $("jogo").style.display = qual === "jogo" ? "flex" : "none";
  if(qual === "jogo"){ $("menu").classList.add("hidden"); $("espera").classList.add("hidden"); }
}
function aviso(t){ $("msg").textContent = t; }

// ---------- Conexão ----------
function codigoAleatorio(){
  const l = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  return Array.from({length:4}, () => l[Math.floor(Math.random()*l.length)]).join("");
}
function criarSala(tentativa = 0){
  souHost = true;
  const cod = codigoAleatorio();
  peer = new Peer(PREFIXO + cod, PEER_CONFIG);
  peer.on("open", () => { $("codigo").textContent = cod; mostrar("espera"); aviso(""); });
  peer.on("error", e => {
    if(e.type === "unavailable-id" && tentativa < 5) return criarSala(tentativa+1);
    aviso("Erro ao criar sala: " + e.type);
  });
  peer.on("connection", c => {
    if(conn){ c.close(); return; }
    conn = c; configurarConn();
  });
}
function entrarSala(codParam){
  const cod = (codParam || $("entrada").value).trim().toUpperCase();
  if(cod.length !== 4) return aviso("Digite o código de 4 letras.");
  souHost = false; aviso("Conectando via STUN/WebRTC…");
  peer = new Peer(PEER_CONFIG);
  peer.on("open", () => {
    conn = peer.connect(PREFIXO + cod);
    configurarConn();
    setTimeout(() => { 
      if(conn && !conn.open) aviso("Não conectou. Peça para desativar AdBlock/VPN ou verifique a conexão."); 
    }, 10000);
  });
  peer.on("error", e => aviso(e.type === "peer-unavailable" ? "Sala não encontrada. Confira o código." : "Erro: " + e.type));
}
function iniciar(){
  aviso(""); mostrar("jogo");
  if(souHost){ s = novoEstado(); saque(Math.random() < .5 ? 1 : -1); }
  requestAnimationFrame(loop);
}
function configurarConn(){
  if(conn.open) iniciar(); else conn.on("open", iniciar);
  conn.on("data", d => {
    if(souHost) outroY = d;          // convidado mandou sua raquete
    else s = d;                      // host mandou o estado
  });
  conn.on("close", () => { aviso("O outro jogador saiu."); setTimeout(() => location.reload(), 2500); });
}

// ---------- Controles ----------
const cv = $("c");
function posY(clientY){
  const r = cv.getBoundingClientRect();
  meuY = Math.max(PH/2, Math.min(H-PH/2, (clientY - r.top) / r.height * H));
}
cv.addEventListener("pointermove", e => posY(e.clientY));
cv.addEventListener("pointerdown", e => posY(e.clientY));
addEventListener("keydown", e => teclas[e.key.toLowerCase()] = true);
addEventListener("keyup", e => teclas[e.key.toLowerCase()] = false);
function teclado(){
  if(teclas["arrowup"] || teclas["w"]) meuY -= 7;
  if(teclas["arrowdown"] || teclas["s"]) meuY += 7;
  meuY = Math.max(PH/2, Math.min(H-PH/2, meuY));
}

// ---------- Lógica (só no host) ----------
function atualizar(){
  s.y1 = meuY; s.y2 = outroY;
  if(s.fim) return;
  if(s.pausa > 0){ s.pausa--; return; }
  s.bx += s.vx; s.by += s.vy;
  if(s.by < R){ s.by = R; s.vy = Math.abs(s.vy); }
  if(s.by > H-R){ s.by = H-R; s.vy = -Math.abs(s.vy); }
  // raquete esquerda (host)
  if(s.vx < 0 && s.bx - R < 20+PW && s.bx > 20 && Math.abs(s.by - s.y1) < PH/2 + R) rebater(s.y1, 1, 20+PW+R);
  // raquete direita (convidado)
  if(s.vx > 0 && s.bx + R > W-20-PW && s.bx < W-20 && Math.abs(s.by - s.y2) < PH/2 + R) rebater(s.y2, -1, W-20-PW-R);
  if(s.bx < -R){ s.p2++; ponto(1); }
  if(s.bx > W+R){ s.p1++; ponto(-1); }
}
function rebater(py, dir, x){
  const off = (s.by - py) / (PH/2);          // -1 a 1
  const vel = Math.min(Math.hypot(s.vx, s.vy) * 1.06, 14);
  const ang = off * 1.0;                      // até ~57°
  s.vx = dir * vel * Math.cos(ang); s.vy = vel * Math.sin(ang);
  s.bx = x;
}
function ponto(dir){
  if(s.p1 >= VENCE) s.fim = "Você venceu!";
  else if(s.p2 >= VENCE) s.fim = "Convidado venceu!";
  else saque(dir);
}

// ---------- Desenho ----------
function desenhar(){
  const g = cv.getContext("2d");
  g.clearRect(0,0,W,H);
  g.strokeStyle = "rgba(233,239,230,.5)"; g.lineWidth = 3; g.setLineDash([14,14]);
  g.beginPath(); g.moveTo(W/2,0); g.lineTo(W/2,H); g.stroke(); g.setLineDash([]);
  g.fillStyle = "#e9efe6";
  g.fillRect(20, s.y1-PH/2, PW, PH);
  g.fillRect(W-20-PW, s.y2-PH/2, PW, PH);
  g.fillStyle = "#ffb703";
  g.beginPath(); g.arc(s.bx, s.by, R, 0, Math.PI*2); g.fill();
  g.fillStyle = "#e9efe6"; g.font = "bold 56px Trebuchet MS, sans-serif"; g.textAlign = "center";
  g.fillText(s.p1, W/2-80, 70); g.fillText(s.p2, W/2+80, 70);
  g.font = "18px Trebuchet MS, sans-serif";
  g.fillText(souHost ? "você" : "oponente", W/2-80, 96);
  g.fillText(souHost ? "oponente" : "você", W/2+80, 96);
  if(s.fim){
    const euVenci = (souHost && s.p1 >= VENCE) || (!souHost && s.p2 >= VENCE);
    g.fillStyle = "rgba(0,0,0,.55)"; g.fillRect(0,H/2-50,W,100);
    g.fillStyle = "#ffb703"; g.font = "bold 44px Trebuchet MS, sans-serif";
    g.fillText(euVenci ? "Você venceu!" : "Você perdeu", W/2, H/2+15);
  }
}

// ---------- Loop ----------
function loop(){
  if(!conn || !conn.open) return;
  teclado();
  if(souHost){
    atualizar();
    conn.send(s);
  } else {
    conn.send(meuY);
  }
  desenhar();
  requestAnimationFrame(loop);
}

if(typeof Peer === "undefined") aviso("Não foi possível carregar a biblioteca PeerJS. Verifique a conexão com a internet.");
$("criar").onclick = () => typeof Peer === "undefined" ? aviso("PeerJS não carregou.") : criarSala();
$("entrar").onclick = () => typeof Peer === "undefined" ? aviso("PeerJS não carregou.") : entrarSala();
$("entrada").addEventListener("keydown", e => { if(e.key === "Enter") entrarSala(); });

// Suporte a entrar por parâmetro na URL (?sala=XXXX)
const urlParams = new URLSearchParams(window.location.search);
const salaQuery = urlParams.get('sala');
if (salaQuery) {
  $("entrada").value = salaQuery;
}
</script>
</body>
</html>
